<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Goutham Raju</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="./assets/icons/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #111313;
      color: #e9edeb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .e { max-width: 480px; }
    .e__code {
      font-size: 6rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #41651a;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .e__title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .e__desc {
      color: #b0bab5;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .e__link {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #41651a;
      color: #fff;
      font-weight: 600;
      border-radius: 0.5rem;
      text-decoration: none;
      transition: background 0.15s;
    }
    .e__link:hover { background: #345115; }
  </style>
  <script>
    // Redirect to homepage after 5 seconds
    setTimeout(() => { window.location.href = '/'; }, 5000);
  </script>
</head>
<body>
  <div class="e">
    <p class="e__code">404</p>
    <h1 class="e__title">Page Not Found</h1>
    <p class="e__desc">The page you're looking for doesn't exist or was moved. You'll be redirected to the homepage in a moment.</p>
    <a href="/" class="e__link">← Back to Home</a>
  </div>
</body>
</html>
